    review_type: direct
    timezone: AoE
    # TODO: NeurIPS 2027 일정 미발표 (https://neurips.cc/Conferences/2027/Dates 404, 2026-10-29 기준).
    deadlines: []

  - name: ICLR
    group: ML
    url: https://iclr.cc/
    review_type: direct
    timezone: AoE
    deadlines:
      # "all times are UTC-12h, aka Anywhere on Earth" — 시각은 미표기라 23:59로 둠
      - {year: 2027, kind: abstract, at: "2026-09-18 23:59",  # https://iclr.cc/Conferences/2027/CallForPapers
         url: "https://iclr.cc/Conferences/2027/Dates", note: "출처에 시각 미표기 (23:59 AoE로 가정)"}
      - {year: 2027, kind: paper, at: "2026-09-25 23:59",  # https://iclr.cc/Conferences/2027/CallForPapers
         url: "https://iclr.cc/Conferences/2027/Dates", note: "출처에 시각 미표기 (23:59 AoE로 가정)"}

  - name: ICML
