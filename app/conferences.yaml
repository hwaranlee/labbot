  - name: ARR 2027 Jan
    group: ARR
    url: https://aclrollingreview.org/dates
    review_type: arr_cycle
    timezone: AoE
    commit_to: [ACL]
    # TODO: ARR 페이지에 "ACL 2027 · January, 2027"만 있고 날짜는 미발표.
    deadlines: []

  # ── ML ───────────────────────────────────────────────
