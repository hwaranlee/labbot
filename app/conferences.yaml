      # 이전 CFP PDF와 다른 사이트에는 9/16, 9/17도 있음 — 연장된 날짜로 보임.
      - {year: 2027, kind: paper, at: "2026-09-23 23:59",  # https://2027.ieeeicassp.org/?p=3718
         url: "https://2027.ieeeicassp.org/?p=3718", note: "출처에 시각·시간대 미표기 (23:59 AoE로 가정)"}
